<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Shield Shadow & Base -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" />
      <stop offset="100%" stop-color="#07152B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Body -->
  <g filter="url(#dropShadow)">
    <path d="M100 12 L168 36 C168 116 136 166 100 188 C64 166 32 116 32 36 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Shield Trim -->
  <path d="M100 22 L158 44 C158 112 130 156 100 176 C70 156 42 112 42 44 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        stroke-dasharray="3 3" 
        opacity="0.8"/>

  <!-- Academic Crest Chevron / "A" for Apex -->
  <path d="M100 48 L138 120 L122 120 L112 100 L88 100 L78 120 L62 120 Z" 
        fill="url(#goldGrad)" />
  <polygon points="100,68 93,88 107,88" fill="#0F284E"/>

  <!-- Open Book of Knowledge -->
  <path d="M72 132 C82 127 94 128 100 134 C106 128 118 127 128 132 L128 148 C118 143 106 144 100 150 C94 144 82 143 72 148 Z" 
        fill="url(#silverGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5"/>
  <line x1="100" y1="134" x2="100" y2="150" stroke="#0F284E" stroke-width="1.5"/>

  <!-- Star of Excellence at Top Apex -->
  <polygon points="100,28 102.5,34 109,34.5 104,39 105.5,45.5 100,42 94.5,45.5 96,39 91,34.5 97.5,34" 
           fill="url(#goldGrad)"/>
</svg>
